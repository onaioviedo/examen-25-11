<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Web de estudio para el examen escrito de Big Data / IA: Python básico, EDA, POO y Regex." />
    <title>Estudio Big Data</title>
    <script>
      // Aplica el tema antes de pintar para evitar parpadeos.
      (function () {
        var tema = null;
        try { tema = localStorage.getItem('estudio-tema'); } catch (e) {}
        var oscuro = tema ? tema === 'oscuro' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (oscuro) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
